<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Դինո Գանձարան</title>
<style>
:root{--g1:#7c5cff;--g2:#34d3c5;--g3:#ffd86b;--ink:#2b2350;--card:rgba(255,255,255,.82);--inc:#1fb57a;--exp:#ff6b8b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:"Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#cfc4ff 0%,#b9f1ea 55%,#fff1c2 100%);display:flex;justify-content:center}
#app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;position:relative}
main{flex:1;overflow-y:auto;padding:14px 16px 100px}
h2{margin:6px 0 12px;font-size:22px}
.card{background:var(--card);border-radius:22px;padding:14px;box-shadow:0 6px 18px rgba(124,92,255,.15);margin-bottom:12px}
.top{display:flex;gap:10px}
.top .card{flex:1;margin:0;color:#fff;text-align:center}
.top .i{background:linear-gradient(135deg,#1fb57a,#34d3c5)}
.top .e{background:linear-gradient(135deg,#ff6b8b,#ffa36b)}
.top small{opacity:.9;font-weight:700}.top b{display:block;font-size:20px;margin-top:2px}
.stage{display:flex;flex-direction:column;align-items:center;margin-top:18px}
.bubble{background:#fff;border-radius:18px;padding:8px 14px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.08);position:relative;margin-bottom:10px;text-align:center}
.bubble:after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff}
#dino{width:230px;height:230px;cursor:pointer;filter:drop-shadow(0 14px 14px rgba(60,40,140,.25));animation:enter 1s cubic-bezier(.3,1.6,.5,1) both,idle 3s 1s ease-in-out infinite}
#dino.tap{animation:jump .7s ease both}
@keyframes enter{from{transform:scale(0) rotate(-25deg)}to{transform:scale(1) rotate(0)}}
@keyframes idle{50%{transform:translateY(-8px) rotate(1.5deg)}}
@keyframes jump{30%{transform:translateY(-40px) scale(.95,1.08)}60%{transform:translateY(0) scale(1.1,.9)}100%{transform:scale(1)}}
.pop{position:absolute;font-size:28px;animation:fly 1s ease-out forwards;pointer-events:none}
@keyframes fly{to{transform:translateY(-90px);opacity:0}}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #0001}
.row:last-child{border:0}
.ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,#e6deff,#d2f7f2);margin-right:10px}
.l{display:flex;align-items:center}.l small{display:block;opacity:.6}
.pos{color:var(--inc);font-weight:800}.neg{color:var(--exp);font-weight:800}
.mnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mnav button{border:0;width:40px;height:40px;border-radius:14px;background:#fff;font-size:18px;color:var(--ink)}
.bar{height:14px;border-radius:9px;background:#0001;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--g1),var(--g2))}
nav{position:absolute;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.92);border-radius:28px;display:flex;justify-content:space-around;align-items:center;padding:8px 6px;box-shadow:0 8px 24px rgba(124,92,255,.3)}
nav button{border:0;background:none;font-size:11px;font-weight:800;color:#8a82b5;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;font-family:inherit}
nav button span{font-size:22px}
nav button.on{color:var(--g1)}
nav .plus{width:58px;height:58px;border-radius:50%;margin-top:-30px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-size:34px;box-shadow:0 6px 16px rgba(124,92,255,.5);justify-content:center;padding:0}
.sheet{position:absolute;inset:0;background:#2b235088;display:flex;align-items:flex-end;z-index:5}
.sheet>div{background:#fff;width:100%;border-radius:28px 28px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.seg{display:flex;background:#eee9ff;border-radius:16px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;border-radius:12px;padding:10px;font-weight:800;background:none;font-family:inherit;color:var(--ink)}
.seg button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
input[type=number],input[type=text],select{width:100%;padding:13px;border-radius:14px;border:2px solid #e6deff;font-size:18px;margin-bottom:10px;font-family:inherit;color:var(--ink)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cats button{border:2px solid #e6deff;background:#fff;border-radius:14px;padding:7px 10px;font-family:inherit;font-weight:700;color:var(--ink)}
.cats button.on{border-color:var(--g1);background:#efe9ff}
.go{width:100%;border:0;border-radius:18px;padding:15px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));font-family:inherit}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chips button{flex:1;border:0;padding:12px;border-radius:14px;font-weight:800;background:#fff;font-family:inherit;color:var(--ink)}
.chips button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.empty{text-align:center;opacity:.6;padding:18px}
body{background:radial-gradient(circle at 15% 12%,#fff 0,#fff0 18%),radial-gradient(circle at 90% 70%,#ffe9a8 0,#ffe9a800 30%),linear-gradient(160deg,#c3b5ff 0%,#a9ece3 55%,#fff1c2 100%)}
.stage{perspective:700px}
#tilt{transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out}
.stage:after{content:"";width:170px;height:22px;border-radius:50%;background:radial-gradient(#3b2a6b55,#3b2a6b00 70%);margin-top:-16px}
.card{background:linear-gradient(145deg,#fff,#ece6ff);border:1px solid #fff;box-shadow:0 8px 0 -1px #cbbfff,0 18px 26px rgba(80,60,160,.25),inset 0 2px 0 #fff}
.top{padding-bottom:10px}
.top .i{background:linear-gradient(160deg,#58e0a6,#16a574 60%,#34d3c5);box-shadow:0 8px 0 #0f7d57,0 18px 24px rgba(15,125,87,.35),inset 0 3px 5px rgba(255,255,255,.55)}
.top .e{background:linear-gradient(160deg,#ff9bb0,#ff5d82 60%,#ffa36b);box-shadow:0 8px 0 #c93e63,0 18px 24px rgba(201,62,99,.35),inset 0 3px 5px rgba(255,255,255,.55)}
.bubble{background:linear-gradient(#fff,#f1ecff);box-shadow:0 5px 0 #d6ccff,0 12px 18px rgba(80,60,160,.2)}
.ic{background:linear-gradient(145deg,#f3eeff,#cdf6f0);box-shadow:0 4px 0 #b9ade8,inset 0 2px 0 #fff}
.bar{box-shadow:inset 0 3px 5px rgba(60,40,140,.25);background:#e4ddff}
.bar i{box-shadow:inset 0 3px 3px rgba(255,255,255,.5),0 2px 4px rgba(60,40,140,.3)}
nav{background:linear-gradient(#fff,#efe9ff);box-shadow:0 7px 0 #cbbfff,0 20px 30px rgba(80,60,160,.35),inset 0 2px 0 #fff}
nav .plus{background:radial-gradient(circle at 35% 25%,#b8a6ff,#7c5cff 55%,#34d3c5);box-shadow:0 7px 0 #5238c9,0 16px 22px rgba(82,56,201,.5),inset 0 3px 5px rgba(255,255,255,.6)}
nav .plus:active{transform:translateY(5px);box-shadow:0 2px 0 #5238c9,0 6px 10px rgba(82,56,201,.4)}
.go,.chips button,.seg button,.cats button,.mnav button{box-shadow:0 5px 0 #cbbfff,0 9px 12px rgba(80,60,160,.18);transition:transform .08s,box-shadow .08s}
.go{box-shadow:0 6px 0 #5238c9,0 12px 16px rgba(82,56,201,.35),inset 0 2px 3px rgba(255,255,255,.5)}
.go:active,.chips button:active,.seg button:active,.cats button:active,.mnav button:active{transform:translateY(4px);box-shadow:0 1px 0 #cbbfff}
.chips button.on,.seg button.on{box-shadow:0 5px 0 #5238c9,inset 0 2px 3px rgba(255,255,255,.5)}
.sheet>div{box-shadow:0 -10px 30px rgba(43,35,80,.3),inset 0 3px 0 #fff;background:linear-gradient(#fff,#f4f0ff)}
input[type=number],input[type=text]{box-shadow:inset 0 3px 6px rgba(80,60,160,.15)}
#app{height:100dvh}
nav{left:50%;right:auto;transform:translateX(-50%);width:calc(100% - 24px);max-width:440px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;justify-items:center}
nav button{width:100%}
nav .plus{width:58px;justify-self:center}
#app{height:100%;max-height:100dvh}
main{overflow-x:hidden}
nav button{min-width:0;padding:4px 2px;font-size:10px;white-space:nowrap}
.chips button{min-width:0;padding:12px 4px}
.top b{font-size:clamp(15px,5vw,20px);overflow-wrap:anywhere}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cg small{opacity:.6;font-weight:800}
.cg .d{border:0;background:none;height:42px;border-radius:14px;font:inherit;font-weight:700;color:var(--ink);position:relative;padding:0}
.cg .d.td{box-shadow:inset 0 0 0 2px #ffd86b}
.cg .d.on{background:linear-gradient(160deg,#58e0a6,#16a574);color:#fff;box-shadow:0 4px 0 #0f7d57,inset 0 0 0 2px #ffd86b}
.dots{position:absolute;bottom:3px;left:0;right:0;display:flex;justify-content:center;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%}
.dots .in{background:var(--inc)}.dots .ex{background:var(--exp)}
.sr{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;padding:8px 0;font-weight:700;font-size:15px;align-items:center}
@media(min-width:700px){#app{max-width:760px}main{padding:28px 48px 130px}#dino{width:300px;height:300px}.top b{font-size:24px}.sheet{align-items:center;justify-content:center}.sheet>div{max-width:440px;border-radius:28px}}

function askPin(f){pcb=f;document.getElementById("sh").innerHTML='<div class="sheet" style="align-items:center;justify-content:center"><div style="max-width:300px;text-align:center;border-radius:28px"><h2>🔒 '+N[S.lang].ask+'</h2><input id="pi" type="number" inputmode="numeric" oninput="if(this.value==S.ppin){var f=pcb;closeAdd();f()}"><button class="go" onclick="closeAdd()">✖</button></div></div>'}
function wishCard(){var x=N[S.lang],h='<div class="card"><b>🛍️ '+x.wl+'</b>';S.wish.forEach(function(w){var hl=Math.ceil((w.t+864e5-Date.now())/36e5);h+='<div class="row"><div>'+esc(w.n)+'<small style="display:block;opacity:.6">'+money(w.amt)+'</small></div>'+(hl>0?'<span>⏳ '+hl+x.wt+'</span>':'<div class="ac"><button onclick="buyW('+w.id+')">🛒</button><button onclick="skipW('+w.id+')">🙅</button></div>')+'</div>'});
return h+'<div style="display:flex;gap:6px;margin-top:8px"><input id="wn" type="text" placeholder="'+x.gn+'" style="margin:0"><input id="wa" type="number" inputmode="decimal" placeholder="'+SY[S.cur]+'" style="margin:0"><button class="go" style="width:60px;flex:none" onclick="addW()">+</button></div></div>'}
function choreCard(){if(!S.chores.length)return"";var x=N[S.lang],h='<div class="card"><b>🧹 '+x.ch+'</b>';S.chores.forEach(function(c){h+='<div class="row"><div>'+esc(c.n)+'<small style="display:block;opacity:.6">+'+money(c.amt)+'</small></div>'+(c.st?'<button onclick="okCh('+c.id+')">⏳👍</button>':'<button class="go" style="width:auto;padding:8px 14px;font-size:14px" onclick="doneCh('+c.id+')">'+x.dn+'</button>')+'</div>'});return h+'</div>'}
function fw(id){return S.wish.filter(function(z){return z.id===id})[0]}
function addW(){var n=document.getElementById("wn").value.trim(),a=parseFloat(document.getElementById("wa").value);if(!n||!(a>0))return;S.wish.push({id:Date.now(),n:n,amt:a*R[S.cur],t:Date.now()});save();render()}
function endW(id,ty,cat,note){var w=fw(id);if(!w)return;S.tx.push({id:Date.now(),type:ty,cat:cat,amt:w.amt,note:note+w.n,date:Date.now()});S.wish=S.wish.filter(function(z){return z.id!==id});save();render()}
function buyW(id){endW(id,"exp","shop","")}
function skipW(id){endW(id,"sav","gl","🙅 ")}
function addCh(){var n=document.getElementById("cn").value.trim(),a=parseFloat(document.getElementById("ca").value);if(!n||!(a>0))return;S.chores.push({id:Date.now(),n:n,amt:a*R[S.cur],st:0});save();render()}
function doneCh(id){S.chores.forEach(function(c){if(c.id===id)c.st=1});save();render()}
function okCh(id){askPin(function(){S.chores.forEach(function(c){if(c.id===id){S.tx.push({id:Date.now(),type:"inc",cat:"gift",amt:c.amt,note:"✅ "+c.n,date:Date.now()});c.st=0}});save();render()})}
function delCh(i){S.chores.splice(i,1);save();render()}
function setPP(){var v=document.getElementById("pp").value;S.ppin=v.length>=4?v:"";save();render()}
function sro(v){S.ru=v?1:0;save();render()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function go(x){if(x!=="set")pu=0;if(x==="set"&&S.mode!=="adult"&&S.ppin&&!pu){askPin(function(){pu=1;tab="set";render()});return}tab=x;render()}
function mv(n){vm+=n;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}render()}
function sl(x){S.lang=x;save();render()}
function sc(x){S.cur=x;save();render()}
function tapD(){var d=document.getElementById("dino");d.classList.remove("tap");void d.getBoundingClientRect();d.classList.add("tap");
document.getElementById("bb").textContent=t("tap");
var r=d.getBoundingClientRect(),em=["💚","⭐","✨","🎉"];
for(var k=0;k<4;k++){var p=document.createElement("div");p.className="pop";p.textContent=em[k];p.style.left=(r.left+30+k*45)+"px";p.style.top=(r.top+20)+"px";p.style.animationDelay=k*.08+"s";document.body.appendChild(p);setTimeout(function(q){q.remove()}.bind(null,p),1300)}}
function openAdd(){
var cs=form.type==="exp"?EC:form.type==="sav"?["gl"]:IC;if(cs.indexOf(form.cat)<0)form.cat=cs[0];
document.getElementById("sh").innerHTML='<div class="sheet" onclick="if(event.target===this)closeAdd()"><div><div class="seg"><button class="'+(form.type==="inc"?"on":"")+'" onclick="ft(\'inc\')">'+t("inc")+'</button><button class="'+(form.type==="exp"?"on":"")+'" onclick="ft(\'exp\')">'+t("exp")+'</button><button class="'+(form.type==="sav"?"on":"")+'" onclick="ft(\'sav\')">🐷</button></div><input id="am" type="number" inputmode="decimal" placeholder="'+t("amt")+' ('+SY[S.cur]+')"><div class="cats">'+cs.map(function(c){return '<button class="'+(form.cat===c?"on":"")+'" onclick="fc(\''+c+'\')">'+CI[c]+' '+t("cats")[c]+'</button>'}).join("")+'</div><input id="nt" type="text" placeholder="'+t("note")+'"><label style="display:block;margin:4px 0 10px;font-weight:700"><input type="checkbox" id="rp"> 🔁 '+N[S.lang].rep+'</label><button class="go" onclick="add()">'+t("save")+'</button></div></div>'}
function keep(){var a=document.getElementById("am"),n=document.getElementById("nt");return[a?a.value:"",n?n.value:""]}
function ft(x){var k=keep();form.type=x;openAdd();document.getElementById("am").value=k[0];document.getElementById("nt").value=k[1]}
function fc(x){var k=keep();form.cat=x;openAdd();document.getElementById("am").value=k[0];document.getElementById("nt").value=k[1]}
function closeAdd(){editId=0;document.getElementById("sh").innerHTML=""}
function add(){var a=parseFloat(document.getElementById("am").value);if(!(a>0))return;
var nt=document.getElementById("nt").value,rp=document.getElementById("rp").checked;if(editId){var o=S.tx.filter(function(z){return z.id===editId})[0];if(o){o.type=form.type;o.cat=form.cat;o.amt=a*R[S.cur];o.note=nt}editId=0}else{S.tx.push({id:Date.now(),type:form.type,cat:form.cat,amt:a*R[S.cur],note:nt,date:Date.now()});if(S.ru&&form.type==="exp"){var am=a*R[S.cur],rr=Math.ceil(am/100)*100-am;if(rr>.5)S.tx.push({id:Date.now()+1,type:"sav",cat:"gl",amt:rr,note:"🔄",date:Date.now()})}if(rp)S.rec.push({type:form.type,cat:form.cat,amt:a*R[S.cur],note:nt,day:now.getDate(),last:ym(new Date())})}fm="wow";setTimeout(function(){fm="";render()},2300);
save();closeAdd();vm=now.getMonth();vy=now.getFullYear();render();var d=document.getElementById("dino");if(d)tapD()}
document.addEventListener("pointermove",function(e){var t=document.getElementById("tilt");if(!t)return;var r=t.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/window.innerWidth,y=(e.clientY-r.top-r.height/2)/window.innerHeight;t.style.setProperty("--ry",Math.max(-1,Math.min(1,x*2))*22+"deg");t.style.setProperty("--rx",Math.max(-1,Math.min(1,-y*2))*18+"deg")});
render();lock();gate();
</script>
</body>
</html>
